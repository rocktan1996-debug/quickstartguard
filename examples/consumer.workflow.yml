# TEMPLATE ONLY. Replace YOUR_OWNER and FULL_REVIEWED_COMMIT_SHA before enabling.
# This template consumes the repository build; it does not pretend an npm release exists.
name: README quickstarts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check out a reviewed QSG revision separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YOUR_OWNER/quickstartguard
          ref: FULL_REVIEWED_COMMIT_SHA
          path: .tools/quickstartguard
          persist-credentials: false
      - run: node .tools/quickstartguard/dist/cli.js validate --config qsg.yml
      - run: node .tools/quickstartguard/dist/cli.js run --config qsg.yml --execute --github
