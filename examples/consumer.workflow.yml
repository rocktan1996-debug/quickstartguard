# Preview workflow for a trusted, opt-in pilot. Copy this into the consumer repo.
# Uses an immutable revision with passing Linux/Windows CI.
# Review README scripts before enabling. QSG executes real commands; it is NOT a sandbox.
# Do not run with secrets, a self-hosted runner, or pull_request_target.
name: README quickstarts (pilot)
on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'qsg.yml'
      - '.github/workflows/quickstart.yml'
permissions:
  contents: read
jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check out reviewed QuickstartGuard revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rocktan1996-debug/quickstartguard
          ref: 84dec79ef88838e371aa8b276a71fe8a12be51e5
          path: .tools/quickstartguard
          persist-credentials: false
      - name: Validate config (never executes commands)
        run: node .tools/quickstartguard/dist/cli.js validate --config qsg.yml
      - name: Execute selected README tests (trusted code only)
        run: node .tools/quickstartguard/dist/cli.js run --config qsg.yml --execute --github
