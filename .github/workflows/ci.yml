name: Verify QuickstartGuard
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Ensure shipped JavaScript matches TypeScript
        run: git diff --exit-code -- dist
      - name: Validate repository README without executing
        run: node dist/cli.js validate
      - name: Run repository README self-check
        run: node dist/cli.js run --execute --github
      - name: Pack without publishing
        run: npm pack --ignore-scripts

  x424-pilot:
    # Only the explicitly approved isolated branch and a manual dispatch run it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pilot/x424-validation-20261024'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out reviewed pilot materials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out fixed QuickstartGuard runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rocktan1996-debug/quickstartguard
          ref: d2730965a5d2a85c51deb28ff679531bc0cacf86
          path: .pilot-qsg
          persist-credentials: false
      - name: Check out fixed upstream synthetic example
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: x424protocol/x424
          ref: 52f49d95b0ebf9d5898d9c89239b604656073bb8
          path: pilots/x424/upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Install fixed package manager without lifecycle scripts
        run: npm install --global pnpm@9.12.0 --ignore-scripts --no-audit --no-fund
      - name: Record real OS, shell and runtime versions
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Write-Output
          node -e "console.log(JSON.stringify({platform:process.platform,os:require('node:os').release(),node:process.version}))"
          pnpm --version
          git -C pilots/x424/upstream rev-parse HEAD
          git -C .pilot-qsg rev-parse HEAD
      - name: Validate selected documentation (no execution)
        run: node .pilot-qsg/dist/cli.js validate --config pilots/x424/qsg.yml
      - name: Execute real synthetic quickstart from marked documentation
        run: node .pilot-qsg/dist/cli.js run --config pilots/x424/qsg.yml --execute --github --verbose --json-out .qsg/results.json --summary-out .qsg/summary.md
      - name: Confirm upstream tracked source was not modified
        if: always()
        run: git -C pilots/x424/upstream diff --exit-code
