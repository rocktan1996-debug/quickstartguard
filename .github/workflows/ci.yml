name: Verify QuickstartGuard
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Ensure shipped JavaScript matches TypeScript
        run: git diff --exit-code -- dist
      - name: Validate repository README without executing
        run: node dist/cli.js validate
      - name: Run repository README self-check
        run: node dist/cli.js run --execute --github
      - name: Pack without publishing
        run: npm pack --ignore-scripts
